<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Juegos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header onclick="loadProfile('main')">
        <h1>Mis Puntajes de Videojuegos</h1>
    </header>

    <div class="controls">
        <div class="profile-selector">
            <button data-profile="z4" onclick="loadProfile('z4')">Z4</button>
            <button data-profile="shenqi" onclick="loadProfile('shenqi')">Shenqi</button>
            <button data-profile="vaelor" onclick="loadProfile('vaelor')">Vaelor</button>
            <button onclick="openAddForm()">Agregar Juego</button>
            <button class="must-play-button" onclick="loadMustPlay()">Lista Cronológica Must Play</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar por título..." oninput="applyFiltersAndSearch()">
        </div>
        <div class="filters">
            <label>Año:</label>
            <select id="filterYear" onchange="applyFiltersAndSearch()">
                <option value="">Todos</option>
            </select>
            <label>Plataforma:</label>
            <select id="filterPlatform" onchange="applyFiltersAndSearch()">
                <option value="">Todos</option>
            </select>
            <label>Género:</label>
            <select id="filterGenre" onchange="applyFiltersAndSearch()">
                <option value="">Todos</option>
            </select>
        </div>
    </div>

    <form id="addForm" class="add-form">
        <h3>Agregar Nuevo Juego</h3>
        <input type="text" id="gameTitle" placeholder="Título" required>
        <input type="number" id="gameYear" placeholder="Año" min="1900" max="2025" required>
        <select id="gamePlatform" required></select>
        <input type="text" id="gameGenre" placeholder="Género" required>
        <input type="number" id="gamePuntaje" placeholder="Puntaje" step="0.01" min="0" max="100" required>
        <input type="text" id="gameImage" placeholder="URL de Imagen (ej. https://ejemplo.com/imagen.jpg)" required>
        <button type="button" onclick="addGame()">Guardar</button>
        <button type="button" onclick="hideForms()">Cancelar</button>
    </form>

    <form id="editForm" class="edit-form">
        <h3>Editar Juego</h3>
        <input type="text" id="editGameTitle" placeholder="Título" required>
        <input type="number" id="editGameYear" placeholder="Año" min="1900" max="2025" required>
        <select id="editGamePlatform" required></select>
        <input type="text" id="editGameGenre" placeholder="Género" required>
        <input type="number" id="editGamePuntaje" placeholder="Puntaje" step="0.01" min="0" max="100" required>
        <input type="text" id="editGameImage" placeholder="URL de Imagen (ej. https://ejemplo.com/imagen.jpg)" required>
        <button type="button" onclick="saveEdit()">Guardar</button>
        <button type="button" onclick="hideForms()">Cancelar</button>
    </form>

    <div id="mainGamesContainer" class="main-games-grid"></div>
    <div id="loadMoreMain" class="load-more" onclick="loadMoreMainGames()" style="display:none;">Cargar más</div>
    <div id="loadAllMain" class="load-all" onclick="loadAllMainGames()" style="display:none;">Cargar todo</div>
    <div id="gamesContainer" class="games-grid" style="display:none;"></div>

    <button class="sync-button" onclick="syncToClipboard()">Copiar Cambios al Portapapeles</button>
    <button class="sync-button" onclick="reloadFromSheets()">Recargar desde Google Sheets</button>

    <div id="mustPlayContainer" style="display:none;">
        <div class="must-play-controls">
            <label>Orden:</label>
            <select id="sortOrder" onchange="applyMustPlayFilters()">
                <option value="asc">Más antiguo al más nuevo</option>
                <option value="desc">Más nuevo al más antiguo</option>
            </select>
            <button class="sync-button" onclick="tryYourLuck()">Proba tu suerte</button>
            <button class="sync-button" onclick="openMustPlayForm()">Agregar Juego Must Play</button>
            <button class="sync-button" onclick="scrollToTop()">Volver arriba</button>
        </div>
        <div id="mustPlayList" class="must-play-grid"></div>
        <div id="loadMoreMustPlay" class="load-more" onclick="loadMoreMustPlayGames()" style="display:none;">Cargar más</div>
        <div id="loadAllMustPlay" class="load-all" onclick="loadAllMustPlayGames()" style="display:none;">Cargar todo</div>
    </div>

    <form id="mustPlayForm" class="must-play-form">
        <h3>Agregar Juego Must Play</h3>
        <input type="text" id="mustPlayTitle" placeholder="Título" required>
        <input type="number" id="mustPlayYear" placeholder="Año" min="1900" max="2025" required>
        <input type="text" id="mustPlayDeveloper" placeholder="Desarrolladora" required>
        <select id="mustPlayPlatform" required></select>
        <input type="text" id="mustPlayImage" placeholder="URL de Imagen (ej. https://ejemplo.com/imagen.jpg)" required>
        <button type="button" onclick="addMustPlayGame()">Guardar</button>
        <button type="button" onclick="hideForms()">Cancelar</button>
    </form>

    <button class="debug-toggle" onclick="toggleDebug()">Mostrar Depuración</button>
    <div id="debug"></div>

    <div id="youtubePlayer"></div>

    <div id="musicPlayer">
        <button id="musicPlayBtn" onclick="toggleMusic()">▶</button>
        <span id="musicNowPlaying">🎵 Música de fondo</span>
        <input type="range" id="musicVolume" min="0" max="100" value="40" oninput="setMusicVolume(this.value)" title="Volumen">
        <button onclick="nextSong()" title="Siguiente canción">⏭</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
